name: AI PR Review (post-CI)

# SEC-04: bước AI/Jira tách khỏi workflow test.
# - `workflow_run` (không phải `pull_request_target`) nên code của PR không được
#   checkout và không được thực thi ở đây; workflow chỉ đọc artifact log.
# - Script luôn được lấy từ NHÁNH BASE (mặc định của repo), có bước xác minh
#   HEAD == origin/<base> để không bao giờ chạy script do PR sửa.
# - Kết quả chỉ là comment cảnh báo; không có quyền `contents: write`, không
#   auto-merge. Việc merge do branch protection + review của maintainer quyết định.

on:
  workflow_run:
    workflows: ["PR Tests"]
    types: [completed]

permissions: {}

jobs:
  ai_review:
    name: AI Quality Gate & Scope Guard
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout base branch (KHÔNG checkout code PR)
        # v4 (pin theo commit SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Xác minh đang chạy script từ nhánh base
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ ! -f ".github/scripts/ai_pr_tester.py" ]; then
            echo "::error::Không tìm thấy .github/scripts/ai_pr_tester.py trên nhánh base."
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse "origin/${BASE_BRANCH}")"
          echo "HEAD=${head_sha}"
          echo "origin/${BASE_BRANCH}=${base_sha}"
          if [ "$head_sha" != "$base_sha" ]; then
            echo "::error::HEAD khác nhánh base — huỷ để tránh chạy script do PR sửa."
            exit 1
          fi

      - name: Set up Python
        # v5 (pin theo commit SHA)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'

      - name: Tải log CI từ run đã kết thúc
        id: download_logs
        # Run bị huỷ thì không có artifact và cũng không cần đánh giá.
        if: github.event.workflow_run.conclusion != 'cancelled'
        # v4 (pin theo commit SHA)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-logs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ci-artifacts

      - name: AI Quality Gate & Scope Verification
        shell: bash
        env:
          # Không nội suy dữ liệu do PR kiểm soát trực tiếp trong `run:`.
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          CI_ARTIFACT_DIR: ci-artifacts
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL || 'https://cotuong69.atlassian.net' }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'COT' }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/ai_pr_tester.py

name: Jira Sync Automation

# SEC-04: workflow này có secret Jira nên phải chạy với quyền tối thiểu và
# KHÔNG bao giờ xử lý PR đến từ fork.
# - `permissions` mặc định rỗng; job chỉ xin `contents: read` để checkout.
# - Job `pull_request_target` bị chặn khi `head.repo.full_name` khác repo này.
# - Script chỉ nhận Issue Key có tiền tố `COT-`.

on:
  create:
  push:
  pull_request_target:
    types: [opened, reopened, closed]
  workflow_dispatch:
    inputs:
      issue_key:
        description: 'Jira Issue Key (e.g. COT-643)'
        required: true
        type: string
      transition_id:
        description: 'Transition ID (11: To Do, 61: READY FOR DEV, 21: In Progress, 71: READY FOR TEST, 31: Done)'
        required: true
        default: '61'
        type: choice
        options:
          - '61'
          - '21'
          - '71'
          - '31'
          - '11'

permissions: {}

jobs:
  jira_transition:
    name: Sync Jira Status
    runs-on: ubuntu-latest
    # Chỉ nhận PR được mở từ chính repository này (PR nội bộ của maintainer).
    # PR từ fork không được phép chuyển trạng thái issue Jira.
    if: github.event_name == 'create' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - name: Checkout Repository (base branch)
        # v4 (pin theo commit SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        # v5 (pin theo commit SHA)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'

      - name: Sync Jira Status
        shell: bash
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL || 'https://cotuong69.atlassian.net' }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'COT' }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REF_TYPE: ${{ github.event.ref_type }}
          REF_NAME: ${{ github.head_ref || github.event.pull_request.head.ref || github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          COMMIT_MESSAGES: ${{ toJson(github.event.commits.*.message) }}
          INPUT_ISSUE_KEY: ${{ github.event.inputs.issue_key }}
          INPUT_TRANSITION_ID: ${{ github.event.inputs.transition_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/jira_sync.py
